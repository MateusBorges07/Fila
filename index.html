<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Controle de vagas - Banheiro</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #1a1a1a;
    color: #fff;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    transition: background 0.25s ease;
    user-select: none;
    -webkit-user-select: none;
  }
  body.disponivel { background: #0f5132; }
  body.cheio { background: #7a1f1f; }

  .titulo {
    font-size: clamp(20px, 3.2vw, 32px);
    font-weight: 600;
    letter-spacing: 0.5px;
    opacity: 0.85;
    margin-bottom: 4px;
    text-transform: uppercase;
  }

  .status {
    font-size: clamp(28px, 5vw, 56px);
    font-weight: 700;
    margin-bottom: 8px;
    text-align: center;
  }

  .contador {
    font-size: clamp(64px, 14vw, 160px);
    font-weight: 800;
    line-height: 1;
    margin-bottom: 8px;
    font-variant-numeric: tabular-nums;
  }

  .sub {
    font-size: clamp(16px, 2.2vw, 24px);
    opacity: 0.8;
    margin-bottom: 40px;
  }

  .botoes {
    display: flex;
    gap: 24px;
    width: 100%;
    max-width: 680px;
  }

  button {
    flex: 1;
    padding: clamp(24px, 4vw, 40px) 12px;
    font-size: clamp(20px, 3vw, 32px);
    font-weight: 700;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    color: #1a1a1a;
    transition: transform 0.08s ease, opacity 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }

  #btnSair { background: #ffd166; }
  #btnVoltar { background: #90e0c8; }

  .rodape {
    margin-top: 40px;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 15px;
    opacity: 0.7;
  }

  .rodape button {
    all: unset;
    cursor: pointer;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
  }
  .rodape button:active { transform: scale(0.9); }

  .config {
    position: fixed;
    top: 16px;
    right: 16px;
    font-size: 13px;
    opacity: 0.5;
  }
</style>
</head>
<body class="disponivel">

  <div class="titulo">Sala <span id="nomeSala">•</span></div>
  <div class="status" id="statusTexto">Vagas disponíveis</div>
  <div class="contador" id="contador">0 / 2</div>
  <div class="sub" id="subTexto">2 vagas livres agora</div>

  <div class="botoes">
    <button id="btnSair">Saiu</button>
    <button id="btnVoltar">Voltou</button>
  </div>

  <div class="rodape">
    <span>Vagas na sala:</span>
    <button id="menos">−</button>
    <strong id="limiteTexto">2</strong>
    <button id="mais">+</button>
  </div>

  <div class="config" id="config"></div>

<script>
  let fora = 0;
  let limite = parseInt(localStorage.getItem('limiteBanheiro')) || 2;

  const body = document.body;
  const contador = document.getElementById('contador');
  const statusTexto = document.getElementById('statusTexto');
  const subTexto = document.getElementById('subTexto');
  const btnSair = document.getElementById('btnSair');
  const btnVoltar = document.getElementById('btnVoltar');
  const limiteTexto = document.getElementById('limiteTexto');

  function atualizar() {
    contador.textContent = fora + ' / ' + limite;
    limiteTexto.textContent = limite;
    const cheio = fora >= limite;

    body.classList.toggle('disponivel', !cheio);
    body.classList.toggle('cheio', cheio);

    statusTexto.textContent = cheio ? 'Sem vagas no momento' : 'Vagas disponíveis';
    subTexto.textContent = cheio
      ? 'Aguarde alguém voltar'
      : (limite - fora) + ' vaga' + ((limite - fora) === 1 ? '' : 's') + ' livre' + ((limite - fora) === 1 ? '' : 's') + ' agora';

    btnSair.disabled = cheio;
    btnVoltar.disabled = fora === 0;
  }

  btnSair.addEventListener('click', () => {
    if (fora < limite) { fora++; atualizar(); }
  });

  btnVoltar.addEventListener('click', () => {
    if (fora > 0) { fora--; atualizar(); }
  });

  document.getElementById('mais').addEventListener('click', () => {
    limite = Math.min(10, limite + 1);
    localStorage.setItem('limiteBanheiro', limite);
    atualizar();
  });

  document.getElementById('menos').addEventListener('click', () => {
    limite = Math.max(1, limite - 1);
    if (fora > limite) fora = limite;
    localStorage.setItem('limiteBanheiro', limite);
    atualizar();
  });

  // Nome da sala fica salvo no navegador - pergunta só na primeira vez
  let sala = localStorage.getItem('nomeSala');
  if (!sala) {
    sala = prompt('Nome da turma/sala (ex: 8A):', '') || '—';
    localStorage.setItem('nomeSala', sala);
  }
  document.getElementById('nomeSala').textContent = sala;

  atualizar();
</script>

</body>
</html>
