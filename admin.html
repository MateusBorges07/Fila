<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do Gestor - Banheiro</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #1a1a1a;
    color: #fff;
    min-height: 100vh;
    padding: 24px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitulo { opacity: 0.7; font-size: 14px; margin-bottom: 24px; }

  .telaSenha { max-width: 360px; margin: 80px auto; text-align: center; }
  .telaSenha input {
    width: 100%; font-size: 18px; padding: 14px; border-radius: 10px; border: none;
    text-align: center; margin-bottom: 12px;
  }
  .telaSenha button {
    width: 100%; padding: 14px; font-size: 16px; font-weight: 700; border: none;
    border-radius: 10px; background: #ffd166; color: #1a1a1a; cursor: pointer;
  }
  .erro { color: #ffb3b3; font-size: 14px; margin-top: 10px; min-height: 18px; }

  #painelSalas { display: none; max-width: 900px; margin: 0 auto; }

  .grade {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 14px;
  }
  .cardSala {
    background: #262626;
    border-radius: 14px;
    padding: 16px;
    text-align: center;
    border: 2px solid transparent;
  }
  .cardSala.cheio { border-color: #b33636; background: #3a1a1a; }
  .cardSala .codigo { font-size: 16px; font-weight: 700; opacity: 0.85; margin-bottom: 6px; text-transform: uppercase; }
  .cardSala .valores { font-size: 28px; font-weight: 800; }
  .cardSala .rotulo { font-size: 12px; opacity: 0.6; margin-top: 4px; }

  .semSalas { opacity: 0.6; font-size: 14px; margin-top: 20px; }
  .rodapeAtualizacao { text-align: center; font-size: 12px; opacity: 0.5; margin-top: 24px; }
  .botaoAtualizar {
    display: block; margin: 16px auto 0; background: none; border: 1px solid rgba(255,255,255,0.3);
    color: #fff; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
</style>
</head>
<body>

  <div class="telaSenha" id="telaSenha">
    <h1>Painel do Gestor</h1>
    <div class="subtitulo">Digite a senha de administrador para ver todas as salas</div>
    <input type="password" id="inputSenha" placeholder="Senha">
    <button id="btnEntrarAdmin">Entrar</button>
    <div class="erro" id="erroSenha"></div>
  </div>

  <div id="painelSalas">
    <h1>Painel do Gestor</h1>
    <div class="subtitulo">Vagas de banheiro em uso por sala, atualizado a cada 5 segundos</div>
    <div class="grade" id="grade"></div>
    <div class="semSalas" id="semSalas" style="display:none;">Nenhuma sala cadastrada ainda.</div>
    <button class="botaoAtualizar" id="btnAtualizar">Atualizar agora</button>
    <div class="rodapeAtualizacao" id="ultimaAtualizacao"></div>
  </div>

<script>
  const API_URL = 'https://illuvial-unalcoholised-arletha.ngrok-free.dev/banheiro.php';
  let senha = null;
  let intervalo = null;

  document.getElementById('btnEntrarAdmin').addEventListener('click', entrar);
  document.getElementById('inputSenha').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') entrar();
  });
  document.getElementById('btnAtualizar').addEventListener('click', carregarSalas);

  async function entrar() {
    const valor = document.getElementById('inputSenha').value;
    if (!valor) return;
    senha = valor;

    const ok = await carregarSalas();
    if (ok) {
      document.getElementById('telaSenha').style.display = 'none';
      document.getElementById('painelSalas').style.display = 'block';
      intervalo = setInterval(carregarSalas, 5000);
    }
  }

  async function carregarSalas() {
    const erroEl = document.getElementById('erroSenha');
    try {
      const url = API_URL + '?listar=1&senha=' + encodeURIComponent(senha);
      const resposta = await fetch(url, {
        headers: { 'ngrok-skip-browser-warning': 'true' },
      });

      if (resposta.status === 403) {
        erroEl.textContent = 'Senha incorreta.';
        return false;
      }
      if (!resposta.ok) throw new Error('status ' + resposta.status);

      const salas = await resposta.json();
      erroEl.textContent = '';
      renderizarSalas(salas);
      return true;
    } catch (e) {
      console.error('Falha ao carregar salas:', e);
      erroEl.textContent = 'Não foi possível conectar ao servidor.';
      return false;
    }
  }

  function renderizarSalas(salas) {
    const grade = document.getElementById('grade');
    const semSalas = document.getElementById('semSalas');

    if (!salas.length) {
      grade.innerHTML = '';
      semSalas.style.display = 'block';
    } else {
      semSalas.style.display = 'none';
      grade.innerHTML = salas.map(s => `
        <div class="cardSala ${s.fora >= s.limite ? 'cheio' : ''}">
          <div class="codigo">${s.codigo}</div>
          <div class="valores">${s.fora} / ${s.limite}</div>
          <div class="rotulo">fora agora</div>
        </div>
      `).join('');
    }

    document.getElementById('ultimaAtualizacao').textContent =
      'Última atualização: ' + new Date().toLocaleTimeString('pt-BR');
  }
</script>

</body>
</html>
